[build-system]
requires = ["hatchling==1.2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hyboat"]

[tool.hatch.build]
include = ["hyboat/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["hyboat/**/tests"]

[project]
name = "hyboat"
version = "1.0.0"
authors = [{name = "ualivent", email = "ualivent@gmail.com"}]
maintainers = [{name = "ualivent", email = "ualivent@gmail.com"}]
description = "HyBoat cryptographic file encoding and recoverability toolkit"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "black==24.8.0",
    "click",
    "flake8==7.0.0",
    "lt-code==0.3.3",
    "matplotlib==3.9.2",
    "numpy==2.2.6",
    "pytest==9.0.2",
    "pytz==2024.2",
    "rich==13.9.1",
    "ruff==0.15.6",
    "timeit-decorator",
]

[project.scripts]
hyboat = "hyboat.hyboat:main"
hyboat-test = "hyboat.test:main"
