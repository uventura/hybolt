[build-system]
requires = ["hatchling==1.2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hybolt"]

[tool.hatch.build]
include = ["hybolt/**/*.py"]

[tool.pytest.ini_options]
testpaths = ["hybolt/**/tests"]

[project]
name = "hybolt"
version = "1.0.0"
authors = [{name = "ualivent", email = "ualivent@gmail.com"}]
maintainers = [{name = "ualivent", email = "ualivent@gmail.com"}]
description = "HyBolt cryptographic file encoding and recoverability toolkit"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "black==24.8.0",
    "click",
    "flake8==7.0.0",
    "matplotlib==3.9.2",
    "numpy==2.2.6",
    "pytest==9.0.2",
    "pytz==2024.2",
    "raptorq==2.0.0",
    "rich==13.9.1",
    "ruff==0.15.6",
    "timeit-decorator",
]

[project.scripts]
hybolt = "hybolt.hybolt:main"
hybolt-test = "hybolt.test:main"
